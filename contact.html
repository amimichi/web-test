<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Amimichi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header>
          <a href="index.html" class="logo" aria-label="Amimichi, ir al inicio">
              <img src="assets/img/logos/3.png" alt="Logo de Amimichi" class="logo-img">
          </a>
            <div class="header-actions">
            <a href="index.html" class="btn-contact-header" data-translate="back-home">Volver</a>
            <button class="hamburger" aria-label="Abrir menú" aria-expanded="false" aria-controls="side-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div class="side-menu" id="side-menu">
        <nav>
            <a href="index.html#quienes-somos" data-translate="about">Quiénes Somos</a>
            <a href="index.html#servicios" data-translate="services">Servicios</a>
            <a href="index.html#clientes" data-translate="clients">Clientes</a>
            <a href="index.html#productos" data-translate="products">Productos</a>
            <a href="index.html" data-translate="back-home">Volver al Inicio</a>
        </nav>
        <div class="language-selector">
            <label for="languageSelect" data-translate="language">Idioma:</label>
            <select id="languageSelect">
                <option value="es">🇪🇸 Español</option>
                <option value="en">🇬🇧 English</option>
                <option value="pt">🇵🇹 Português</option>
                <option value="ja">🇯🇵 日本語</option>
            </select>
        </div>
    </div>

    <main>
        <section class="hero contact-hero">
            <div class="hero-blob"></div>
            <h1 class="reveal" data-translate="contact-title">Contáctanos</h1>
            <p class="subtitle reveal" data-translate="contact-subtitle">Estamos aquí para ayudarte</p>
        </section>

        <section class="contact-section">
            <div class="contact-container">
                <div class="contact-form-wrapper reveal">
                    <form id="contactForm" class="contact-form">
                        <div class="form-group">
                            <label for="name" data-translate="contact-name">Nombre</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email" data-translate="contact-email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message" data-translate="contact-message">Mensaje</label>
                            <textarea id="message" name="message" rows="6" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" data-translate="contact-send">Enviar</button>
                    </form>
                    <div id="formMessage" class="form-message"></div>
                </div>

                <div class="contact-info-wrapper reveal">
                    <div class="contact-info-item">
                        <div class="contact-icon">📧</div>
                        <h3>Email</h3>
                        <p>info@amimichi.com</p>
                    </div>
                    <div class="contact-info-item">
                        <div class="contact-icon">📱</div>
                        <h3>Teléfono</h3>
                        <p>+54 11 1234-5678</p>
                    </div>
                    <div class="contact-info-item">
                        <div class="contact-icon">📍</div>
                        <h3>Ubicación</h3>
                        <p>Buenos Aires, Argentina</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Amimichi. Sport Tech Studio. Todos los derechos reservados.</p>
    </footer>

    <script src="assets/js/translations.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Form submission handler
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formMessage = document.getElementById('formMessage');
            const currentLang = localStorage.getItem('language') || 'es';

            const messages = {
                es: '¡Gracias por tu mensaje! Te contactaremos pronto.',
                en: 'Thank you for your message! We will contact you soon.',
                pt: 'Obrigado pela sua mensagem! Entraremos em contato em breve.',
                ja: 'メッセージありがとうございます！すぐにご連絡いたします。'
            };

            formMessage.textContent = messages[currentLang];
            formMessage.style.display = 'block';
            formMessage.style.opacity = '1';

            this.reset();

            setTimeout(() => {
                formMessage.style.opacity = '0';
                setTimeout(() => {
                    formMessage.style.display = 'none';
                }, 300);
            }, 5000);
        });
    </script>
</body>
</html>
